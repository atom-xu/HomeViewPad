<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">HomePad / Gather — original app symbol exploration</title><desc id="desc">New HomePad symbol derived from VILHIL geometric ideas with user authorization. Not the formal VILHIL logo or an Apple/Samsung icon. Square opaque app master; masking is preview only.</desc><defs><linearGradient id="canvas" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".65" stop-color="#FAFBFA"/><stop offset="1" stop-color="#EFF2F1"/></linearGradient><linearGradient id="link" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#BCC9F7"/><stop offset="1" stop-color="#8B9CEB"/></linearGradient><linearGradient id="body" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#A0B1F6"/><stop offset="1" stop-color="#6B80DE"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#F9C58C"/><stop offset="1" stop-color="#EDA280"/></linearGradient><filter id="soft" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#7588E4" flood-opacity=".11"/></filter></defs><rect width="1024" height="1024" fill="url(#canvas)"/><g id="homepad-symbol" filter="url(#soft)"><g data-part="curved-links" fill="none" stroke="url(#link)" stroke-width="76" stroke-linecap="round"><path d="M330 396 C350 480 430 496 512 634"/><path d="M694 396 C674 480 594 496 512 634"/></g><rect data-part="left-node" x="250" y="286" width="160" height="160" rx="62" fill="url(#body)"/><rect data-part="right-node" x="614" y="286" width="160" height="160" rx="62" fill="url(#body)"/><rect data-part="shared-core" x="424" y="584" width="176" height="176" rx="62" fill="url(#core)"/></g></svg>